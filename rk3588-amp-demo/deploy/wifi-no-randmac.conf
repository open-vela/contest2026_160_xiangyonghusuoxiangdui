# /etc/NetworkManager/conf.d/wifi-no-randmac.conf
# bcmdhd (AP6398S/BCM4359) rejects changing the MAC while the interface is up.
# NetworkManager MAC randomization then fails with 'config-failed' and no
# scan/connect works. Disable randomization and keep the permanent MAC.
[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=permanent
